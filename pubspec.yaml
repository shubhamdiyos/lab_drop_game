name: labdrop_game
description: "LabDrop: Chain Reaction! - A 2D physics drop-and-merge mobile game built with Flutter and Flame (flame_forge2d)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_forge2d: ^0.19.3+7
  shared_preferences: ^2.2.3
  google_mobile_ads: ^5.1.0
  purchases_flutter: ^6.29.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
